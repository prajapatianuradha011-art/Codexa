<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b141a">
    <title>Create account | Codexa Technologies</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>

<body>
    <main class="auth-page">
        <section class="auth-box" aria-labelledby="page-title">
            <a class="brand" href="/" aria-label="Codexa Technologies home">
                <span class="brand-mark">C</span>
                <span class="brand-name">CODEXA <span>TECHNOLOGIES</span></span>
            </a>

            <div class="auth-heading">
                <div class="auth-icon" aria-hidden="true">✦</div>
                <p class="eyebrow">JOIN THE COMMUNITY</p>
                <h1 id="page-title">Create your account</h1>
                <p class="subtitle">Connect, collaborate and chat with your people.</p>
            </div>

            {% if error %}
            <div class="server-message error-message" role="alert">{{ error }}</div>
            {% endif %}

            <form id="signupForm" method="POST" action="{{ url_for('signup') }}" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Choose a username"
                        autocomplete="username" minlength="1" maxlength="30" required>
                    <small class="hint">Use 1–30 characters.</small>
                    <small class="field-error" id="usernameError"></small>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-box">
                        <input id="password" name="password" type="password" placeholder="Create a password"
                            autocomplete="new-password" minlength="8" required>
                        <button class="toggle-eye" type="button" aria-label="Show password" aria-pressed="false"
                            data-password-toggle="password">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <small class="hint">Use at least 8 characters.</small>
                    <small class="field-error" id="passwordError"></small>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-box">
                        <input id="confirmPassword" name="confirm_password" type="password"
                            placeholder="Enter your password again" autocomplete="new-password" required>
                        <button class="toggle-eye" type="button" aria-label="Show password" aria-pressed="false"
                            data-password-toggle="confirmPassword">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <small class="field-error" id="confirmPasswordError"></small>
                </div>

                <div class="form-message" id="formMessage" role="alert" aria-live="polite"></div>
                <button class="submit-button" id="submitButton" type="submit">
                    <span>Create account</span><span aria-hidden="true">→</span>
                </button>
            </form>
            <p class="auth-switch">
                Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </section>
    </main>
</body>

</html>
